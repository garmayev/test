name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    outputs:
      archive_name: ${{ steps.set_archive.outputs.ARCHIVE_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Archive dist folder
        id: set_archive
        run: |
          ARCHIVE_NAME="dist-$(date +%Y%m%d-%H%M%S).zip"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          zip -r $ARCHIVE_NAME dist/

      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-archive
          path: ${{ steps.set_archive.outputs.ARCHIVE_NAME }}
          retention-days: 1

  deploy:
    needs: build-and-archive
    runs-on: ubuntu-latest
    environment: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download deployment archive
        uses: actions/download-artifact@v4
        with:
          name: dist-archive
          path: .

      - name: Get archive name
        id: get_archive
        run: |
          ARCHIVE_FILE=$(ls *.zip | head -n 1)
          echo "ARCHIVE_FILE=$ARCHIVE_FILE" >> $GITHUB_OUTPUT
          echo "ARCHIVE_FILE=$ARCHIVE_FILE" >> $GITHUB_ENV

      - name: Upload to server and notify
        env:
          ARCHIVE_NAME: ${{ steps.get_archive.outputs.ARCHIVE_FILE }}
        run: |
          # Создаем директорию на сервере через SSH
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "mkdir -p ${{ secrets.SERVER_PATH }}/uploads"
          
          # Копируем архив через SCP
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            $ARCHIVE_NAME \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.SERVER_PATH }}/uploads/
          
          # Отправляем HTTP запрос
          curl -X POST "http://${{ secrets.SERVER_IP }}/company/update-app?company_id=4&artifact_name=$ARCHIVE_NAME" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            --fail \
            --show-error
          
          # Очищаем временный ключ
          rm -f /tmp/deploy_key