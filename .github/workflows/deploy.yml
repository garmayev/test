name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        with:
          node-version: '22'
        run: npm install

      - name: Build
        with:
          node-version: '22'
        run: npm run build

      - name: Archive dist folder
        run: |
          ARCHIVE_NAME="dist-$(date +%Y%m%d-%H%M%S).zip"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          zip -r $ARCHIVE_NAME dist/

  upload:
    needs: build-and-archive
    runs-on: ubuntu-latest
    steps:
      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-archive
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 1

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download deployment archive
        uses: actions/download-artifact@v4
        with:
          name: dist-archive
          path: .

      - name: Get archive name
        id: get_archive
        run: |
          ARCHIVE_FILE=$(ls *.zip)
          echo "ARCHIVE_FILE=$ARCHIVE_FILE" >> $GITHUB_ENV
          echo "ARCHIVE_FILE=$ARCHIVE_FILE" >> $GITHUB_OUTPUT

      - name: Upload to server and notify
        env:
          ARCHIVE_NAME: ${{ env.ARCHIVE_FILE }}
        run: |
          echo "SERVER_USER=${{ secrets.SERVER_USER }}"
          echo "SSH_PRIVATE_KEY=${{ secrets.SSH_PRIVATE_KEY }}"
          # Создаем директорию на сервере через SSH
          ssh -o StrictHostKeyChecking=no -i ${{ secrets.SSH_PRIVATE_KEY }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "mkdir -p ${{ secrets.SERVER_PATH }}/uploads"
          
          # Копируем архив через SCP
          scp -o StrictHostKeyChecking=no -i ${{ secrets.SSH_PRIVATE_KEY }} \
            $ARCHIVE_NAME \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.SERVER_PATH }}/uploads/
          
          # Отправляем HTTP запрос
          curl -X POST "http://${{ secrets.SERVER_IP }}/company/update-app?company_id=4&artifact_name=$ARCHIVE_NAME" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            --fail \
            --show-error
          # Update key 2