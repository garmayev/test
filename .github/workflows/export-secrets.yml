name: Export Secrets
on:
  workflow_dispatch: # Allows you to run it manually

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Base64 Encode Secrets
        run: |
          # Replace MY_SECRET_NAME with your actual secret names
          echo "SECRET_1: ${{ secrets.MY_SECRET_NAME }}" | base64 > secrets.txt
          echo "SECRET_2: ${{ secrets.ANOTHER_SECRET }}" | base64 >> secrets.txt

      - name: Upload Secrets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-secrets
          path: secrets.txt
          retention-days: 1 # Automatically deletes quickly for security
